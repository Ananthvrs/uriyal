<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>தேங்காய் உரிக்கும் கணக்குகள்</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        .summary-box {
            margin-top: 25px;
            background: #e8f8f5;
            padding: 15px;
            border-radius: 5px;
            border-left: 5px solid #27ae60;
        }
        .summary-box h3 {
            margin-top: 0;
            color: #16a085;
        }
        .summary-item {
            font-size: 16px;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        #loading {
            text-align: center;
            color: #e67e22;
            font-weight: bold;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>தேங்காய் உரிக்கும் கணக்குகள்</h2>
    
    <form id="coconutForm">
        <!-- Shift Selection -->
        <div class="form-group">
            <label for="shift">ஷிப்ட் (Shift):</label>
            <select id="shift" required>
                <option value="">ஷிப்ட்-ஐ தேர்ந்தெடுக்கவும்</option>
                <option value="First Shift">First Shift</option>
                <option value="Second Shift">Second Shift</option>
                <option value="Third Shift">Third Shift</option>
                <option value="Fourth Shift">Fourth Shift</option>
            </select>
        </div>

        <!-- Name Selection -->
        <div class="form-group">
            <label for="name">பெயர் (Name):</label>
            <select id="name" required>
                <option value="">பெயரைத் தேர்ந்தெடுக்கவும்</option>
                <option value="Raja">Raja</option>
                <option value="Murugesh">Murugesh</option>
                <option value="Pudukkottai Ramasamy">Pudukkottai Ramasamy</option>
            </select>
        </div>

        <!-- Coconut Count -->
        <div class="form-group">
            <label for="count">உரித்த தேங்காய் எண்ணிக்கை (Count):</label>
            <input type="number" id="count" min="1" placeholder="எண்ணிக்கையை உள்ளிடவும்" required>
        </div>

        <button type="submit">பதிவு செய் (Save)</button>
        <div id="loading">தரவு சேமிக்கப்படுகிறது... தயவுசெய்து காத்திருக்கவும்.</div>
    </form>

    <!-- Summary Section -->
    <div class="summary-box">
        <h3>இன்றைய சுருக்கம் (Summary)</h3>
        <div class="summary-item" id="totalPersonCount">இன்று உரிக்கப்பட்ட மொத்த ஆட்கள்: 0</div>
        <div class="summary-item" id="totalCoconutCount">இன்று மொத்தமாக உரித்த தேங்காய்கள்: 0</div>
    </div>
</div>

<script>
    // உள்ளூர் சேமிப்பு (Local State) for live summary
    let todayRecords = [];

    document.getElementById('coconutForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const shift = document.getElementById('shift').value;
        const name = document.getElementById('name').value;
        const count = parseInt(document.getElementById('count').value);
        const date = new Date().toLocaleDateString();

        const data = {
            date: date,
            shift: shift,
            name: name,
            count: count
        };

        // UI-ல் சுருக்க கணக்கீட்டை உடனுக்குடன் புதுப்பிக்க
        todayRecords.push(data);
        updateSummary();

        // -----------------------------------------------------------------
        // Google Sheet-ல் சேமிக்க (Google Apps Script Web App URL-ஐ கீழே மாற்றவும்)
        // -----------------------------------------------------------------
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE'; 
        
        if(scriptURL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
            alert('தரவு உள்ளூர் முறையில் சேர்க்கப்பட்டது. Google Sheet-ல் சேமிக்க ஸ்கிரிப்ட் URL-ஐ உள்ளிடவும்.');
            document.getElementById('coconutForm').reset();
            return;
        }

        document.getElementById('loading').style.display = 'block';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            alert('வெற்றிகரமாக கூகுள் ஷீட்டில் சேமிக்கப்பட்டது!');
            document.getElementById('coconutForm').reset();
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            alert('சேமிப்பதில் பிழை: ' + error);
        });
    });

    function updateSummary() {
        // மொத்த தேங்காய் எண்ணிக்கை
        let totalCoconuts = todayRecords.reduce((sum, record) => sum + record.count, 0);
        
        // தனிப்பட்ட ஆட்களின் எண்ணிக்கை (Unique workers today)
        let uniqueWorkers = [...new Set(todayRecords.map(record => record.name))].length;

        document.getElementById('totalPersonCount').innerText = `இன்று உரிக்கப்பட்ட மொத்த ஆட்கள்: ${uniqueWorkers}`;
        document.getElementById('totalCoconutCount').innerText = `இன்று மொத்தமாக உரித்த தேங்காய்கள்: ${totalCoconuts}`;
    }
</script>

</body>
</html>
